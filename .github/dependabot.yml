version: 2

updates:
  # --- WEB (npm) ---
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- GITHUB ACTIONS ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-deps:
        patterns:
          - "*"

  # --- PRE-COMMIT HOOK REVS ---
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pre-commit-deps:
        patterns:
          - "*"


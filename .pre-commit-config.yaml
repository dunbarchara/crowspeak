# Run `pre-commit install` once after cloning to activate these hooks locally.
# CI runs `pre-commit run --all-files` on every PR.

repos:
  # Secret scanning: blocks commits containing API keys, tokens, or credentials.
  # Highest-value hook: the only layer that stops secrets entering git history at all.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Standard hygiene hooks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # tsconfig*.json is JSONC (contains comments), which check-json rejects.
      - id: check-json
        exclude: ^apps/web/tsconfig.*\.json$

  # Web app (oxlint + prettier). Run only when web files change and need
  # `npm ci` in apps/web first. CI skips these two (the `web` job runs them).
  - repo: local
    hooks:
      - id: oxlint-web
        name: oxlint (web)
        language: system
        entry: npm --prefix apps/web run lint
        files: ^apps/web/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: false
      - id: prettier-web
        name: prettier (web)
        language: system
        entry: npm --prefix apps/web run format:check
        files: ^apps/web/
        pass_filenames: false

  # PLACEHOLDER: add when a Python backend (e.g. apps/api) appears.
  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   rev: v0.16.10
  #   hooks:
  #     - id: ruff
  #       args: [--fix]
  #       files: ^apps/api/.*\.py$
  #     - id: ruff-format
  #       files: ^apps/api/.*\.py$

exclude: |
  (?x)^(
    apps/web/node_modules/.*|
    apps/web/dist/.*|
    apps/web/docs_claude/.*|
    \.vercel/.*|
    .*package-lock\.json
  )$
